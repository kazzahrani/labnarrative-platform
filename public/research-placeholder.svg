  <desc id="desc">Neutral LabNarrative placeholder used when no verified project figure is available.</desc>
  <rect width="1600" height="1000" fill="#f1f0ec"/>
  <g fill="none" stroke="#c7c5bd" stroke-width="2" opacity="0.7">
    <path d="M120 820 C360 520 520 560 720 330 S1120 160 1480 360"/>
    <path d="M120 700 C340 470 590 720 820 470 S1180 260 1480 540"/>
