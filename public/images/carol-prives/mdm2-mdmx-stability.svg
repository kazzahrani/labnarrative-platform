<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">MDM2, MDMX and p53 protein stability</title>
  <desc id="desc">A molecular circuit illustration showing MDM2 and MDMX controlling p53 ubiquitination, degradation and stress activation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f1a22"/><stop offset="1" stop-color="#25343d"/></linearGradient>
    <linearGradient id="p53" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8ecee"/><stop offset="1" stop-color="#d7a4af"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#9b263d"/></marker>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#66b7a1"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g opacity=".12" stroke="#fff"><circle cx="800" cy="520" r="390"/><circle cx="800" cy="520" r="285"/><circle cx="800" cy="520" r="180"/></g>
  <text x="90" y="110" fill="#f7f2ec" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">MDM2 · MDMX · p53</text>
  <text x="90" y="154" fill="#aeb8bd" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="4">PROTEIN STABILITY · UBIQUITINATION · STRESS RESPONSE</text>
  <g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(800 500)">
      <circle r="170" fill="url(#p53)" stroke="#9b263d" stroke-width="12"/>
      <path d="M-70-20C-35-95 42-95 77-20S40 100-28 84-104 52-70-20Z" fill="none" stroke="#9b263d" stroke-width="10"/>
      <text y="20" text-anchor="middle" fill="#17232c" font-family="Georgia, serif" font-size="72" font-weight="700">p53</text>
      <text y="215" text-anchor="middle" fill="#f7f2ec" font-size="22" font-weight="700">transcriptional activity</text>
    </g>
    <g transform="translate(410 350)">
      <rect x="-145" y="-92" width="290" height="184" rx="42" fill="#f1dfb7" stroke="#d7a85a" stroke-width="8"/>
      <text y="5" text-anchor="middle" fill="#49391b" font-size="52" font-weight="800">MDM2</text>
      <text y="44" text-anchor="middle" fill="#806b3d" font-size="18">E3 ubiquitin ligase</text>
    </g>
    <g transform="translate(1180 350)">
      <rect x="-145" y="-92" width="290" height="184" rx="42" fill="#cfe5df" stroke="#66b7a1" stroke-width="8"/>
      <text y="5" text-anchor="middle" fill="#173d33" font-size="52" font-weight="800">MDMX</text>
      <text y="44" text-anchor="middle" fill="#4d7168" font-size="18">p53-binding regulator</text>
    </g>
  </g>
  <g fill="none" stroke-width="8" stroke-linecap="round">
    <path d="M555 380C650 335 710 335 760 365" stroke="#d7a85a" marker-end="url(#arrow)"/>
    <path d="M1045 380C950 335 890 335 840 365" stroke="#66b7a1" marker-end="url(#arrow2)"/>
    <path d="M675 620C560 690 475 730 365 755" stroke="#9b263d" marker-end="url(#arrow)"/>
    <path d="M925 620C1040 690 1125 730 1235 755" stroke="#66b7a1" marker-end="url(#arrow2)"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(260 760)">
      <rect width="410" height="140" rx="28" fill="#21171a" stroke="#9b263d" stroke-width="4"/>
      <text x="205" y="52" text-anchor="middle" fill="#ffd8df" font-size="28" font-weight="800">UBIQUITINATION</text>
      <text x="205" y="88" text-anchor="middle" fill="#c89aa4" font-size="19">proteasomal degradation</text>
      <g fill="#9b263d"><circle cx="70" cy="115" r="11"/><circle cx="100" cy="115" r="11"/><circle cx="130" cy="115" r="11"/><circle cx="160" cy="115" r="11"/></g>
    </g>
    <g transform="translate(930 760)">
      <rect width="410" height="140" rx="28" fill="#142522" stroke="#66b7a1" stroke-width="4"/>
      <text x="205" y="52" text-anchor="middle" fill="#d8f5ed" font-size="28" font-weight="800">STRESS ACTIVATION</text>
      <text x="205" y="88" text-anchor="middle" fill="#9fcfc2" font-size="19">stabilisation and target-gene output</text>
      <path d="M90 116H320" stroke="#66b7a1" stroke-width="5" marker-end="url(#arrow2)"/>
    </g>
  </g>
  <g transform="translate(640 195)" font-family="Arial, Helvetica, sans-serif">
    <rect width="320" height="90" rx="18" fill="#ffffff10" stroke="#ffffff40"/>
    <text x="160" y="38" text-anchor="middle" fill="#f7f2ec" font-size="21" font-weight="700">THERAPEUTIC INTERFACE</text>
    <text x="160" y="67" text-anchor="middle" fill="#abb8bd" font-size="17">reactivate WT p53 · destabilise mutant p53</text>
  </g>
  <text x="1510" y="952" text-anchor="end" fill="#8f9aa0" font-family="Arial, Helvetica, sans-serif" font-size="18">Original LabNarrative scientific illustration</text>
</svg>