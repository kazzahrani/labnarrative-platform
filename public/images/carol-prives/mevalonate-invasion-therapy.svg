<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Metabolism, invasion and therapeutic vulnerabilities</title>
  <desc id="desc">A pathway illustration connecting the mevalonate pathway to protein prenylation, Rho ROCK signalling and invasive cancer-cell movement.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3f1ec"/><stop offset="1" stop-color="#dfe6e4"/></linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9b263d"/><stop offset="1" stop-color="#4d0d1e"/></linearGradient>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#9b263d"/></marker>
    <marker id="g" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#3c8b75"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#173029" flood-opacity=".2"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="90" y="110" fill="#17232c" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">METABOLISM · INVASION · THERAPEUTIC VULNERABILITY</text>
  <text x="90" y="154" fill="#6d7478" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="4">MEVALONATE PATHWAY · PRENYLATION · RHO/ROCK</text>
  <g transform="translate(100 245)" font-family="Arial, Helvetica, sans-serif" filter="url(#shadow)">
    <g>
      <rect width="250" height="130" rx="26" fill="#fff" stroke="#c7cdca" stroke-width="4"/>
      <text x="125" y="55" text-anchor="middle" fill="#17232c" font-size="28" font-weight="800">ACETYL-CoA</text>
      <text x="125" y="91" text-anchor="middle" fill="#6d7478" font-size="18">carbon input</text>
    </g>
    <path d="M255 65H365" stroke="#9b263d" stroke-width="7" marker-end="url(#a)"/>
    <g transform="translate(380)">
      <rect width="270" height="130" rx="26" fill="#f2dde2" stroke="#9b263d" stroke-width="4"/>
      <text x="135" y="52" text-anchor="middle" fill="#6d2635" font-size="27" font-weight="800">HMG-CoA</text>
      <text x="135" y="90" text-anchor="middle" fill="#8a5060" font-size="18">reductase checkpoint</text>
    </g>
    <path d="M655 65H765" stroke="#9b263d" stroke-width="7" marker-end="url(#a)"/>
    <g transform="translate(780)">
      <rect width="270" height="130" rx="26" fill="#ead5da" stroke="#9b263d" stroke-width="4"/>
      <text x="135" y="52" text-anchor="middle" fill="#6d2635" font-size="27" font-weight="800">MEVALONATE</text>
      <text x="135" y="90" text-anchor="middle" fill="#8a5060" font-size="18">biosynthetic hub</text>
    </g>
    <path d="M1055 65H1165" stroke="#9b263d" stroke-width="7" marker-end="url(#a)"/>
    <g transform="translate(1180)">
      <rect width="270" height="130" rx="26" fill="#e3cbd1" stroke="#9b263d" stroke-width="4"/>
      <text x="135" y="52" text-anchor="middle" fill="#6d2635" font-size="27" font-weight="800">GERANYL LIPIDS</text>
      <text x="135" y="90" text-anchor="middle" fill="#8a5060" font-size="18">protein prenylation</text>
    </g>
  </g>
  <g transform="translate(260 475)" font-family="Arial, Helvetica, sans-serif">
    <path d="M0 0H1080" stroke="#3c8b75" stroke-width="8" marker-end="url(#g)"/>
    <g transform="translate(120 35)">
      <circle r="72" fill="#d8eee8" stroke="#3c8b75" stroke-width="7"/>
      <text text-anchor="middle" y="9" fill="#245b4c" font-size="34" font-weight="800">RHO</text>
    </g>
    <g transform="translate(520 35)">
      <circle r="72" fill="#c7e5dc" stroke="#3c8b75" stroke-width="7"/>
      <text text-anchor="middle" y="9" fill="#245b4c" font-size="34" font-weight="800">ROCK</text>
    </g>
    <g transform="translate(900 35)">
      <circle r="72" fill="#b7ddd1" stroke="#3c8b75" stroke-width="7"/>
      <text text-anchor="middle" y="9" fill="#245b4c" font-size="28" font-weight="800">ACTIN</text>
    </g>
    <text x="120" y="145" text-anchor="middle" fill="#4f7168" font-size="18">membrane localisation</text>
    <text x="520" y="145" text-anchor="middle" fill="#4f7168" font-size="18">contractility</text>
    <text x="900" y="145" text-anchor="middle" fill="#4f7168" font-size="18">cell movement</text>
  </g>
  <g transform="translate(1070 665)" filter="url(#shadow)">
    <path d="M-240 145C-175-30-20-120 145-70 250-38 315 50 360 150 240 245 45 280-125 220Z" fill="url(#cell)"/>
    <path d="M-120 170C-65 75 20 30 125 25" fill="none" stroke="#f5b7c2" stroke-width="13" stroke-linecap="round"/>
    <path d="M-85 180L-25 240M-85 180L-145 248M55 75L115 5" stroke="#f5b7c2" stroke-width="11" stroke-linecap="round"/>
    <text x="75" y="135" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800">INVASIVE CELL</text>
    <text x="75" y="180" text-anchor="middle" fill="#e6b5bf" font-family="Arial, Helvetica, sans-serif" font-size="20">3D matrix migration</text>
  </g>
  <g transform="translate(125 670)" font-family="Arial, Helvetica, sans-serif">
    <rect width="560" height="210" rx="30" fill="#17232c"/>
    <text x="38" y="55" fill="#f4f0ea" font-size="23" font-weight="800" letter-spacing="2">THERAPEUTIC ENTRY POINTS</text>
    <g font-size="20">
      <rect x="38" y="88" width="140" height="70" rx="18" fill="#9b263d"/><text x="108" y="132" text-anchor="middle" fill="#fff" font-weight="700">STATIN</text>
      <rect x="205" y="88" width="150" height="70" rx="18" fill="#3c8b75"/><text x="280" y="132" text-anchor="middle" fill="#fff" font-weight="700">ROCK inhibitor</text>
      <rect x="382" y="88" width="140" height="70" rx="18" fill="#d7a85a"/><text x="452" y="132" text-anchor="middle" fill="#392b0e" font-weight="700">BIOMARKER</text>
    </g>
    <text x="38" y="188" fill="#aeb8bd" font-size="18">Target pathway dependence while preserving wild-type p53 function.</text>
  </g>
  <text x="1510" y="952" text-anchor="end" fill="#7e8589" font-family="Arial, Helvetica, sans-serif" font-size="18">Original LabNarrative scientific illustration</text>
</svg>