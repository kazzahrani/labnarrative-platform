  <g font-family="Arial, Helvetica, sans-serif">
    <path d="M800 690C690 760 560 790 420 825" fill="none" stroke="#7fc6a4" stroke-width="5"/>
    <path d="M800 690C800 780 800 820 800 860" fill="none" stroke="#efc76b" stroke-width="5"/>
