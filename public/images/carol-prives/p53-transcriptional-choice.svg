    <path d="M0 72C150-88 300 232 450 72S750-88 900 72S1200 232 1350 72" fill="none" stroke="#f6d8de" stroke-width="10" stroke-linecap="round" opacity=".85"/>
    <g stroke="#e9a8b5" stroke-width="4" opacity=".8">
      <path d="M95 -75L110 139M245 -58L260 155M395 -75L410 139M545 -58L560 155M695 -75L710 139M845 -58L860 155M995 -75L1010 139M1145 -58L1160 155M1295 -75L1310 139"/>
    </g>
