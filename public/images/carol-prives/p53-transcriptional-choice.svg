    <circle cx="230" cy="230" r="116" fill="#f3efe9" stroke="#9b263d" stroke-width="12"/>
    <path d="M88 35H142M88 195H142M35 88V142M195 88V142" stroke="#9b263d" stroke-width="16" stroke-linecap="round"/>
    <text x="115" y="126" text-anchor="middle" fill="#17232c" font-family="Georgia, serif" font-size="64" font-weight="700">p53</text>
