<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Wild-type p53 structure and transcriptional choice</title>
  <desc id="desc">A scientific illustration showing a p53 tetramer bound to DNA and directing alternative gene-expression outcomes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a22"/><stop offset="1" stop-color="#283a45"/></linearGradient>
    <linearGradient id="dna" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9b263d"/><stop offset="1" stop-color="#e6a7b2"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g opacity=".13" stroke="#fff"><path d="M0 160H1600M0 320H1600M0 480H1600M0 640H1600M0 800H1600"/><path d="M200 0V1000M400 0V1000M600 0V1000M800 0V1000M1000 0V1000M1200 0V1000M1400 0V1000"/></g>
  <text x="90" y="110" fill="#f7f2ec" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">WILD-TYPE p53</text>
  <text x="90" y="154" fill="#b7c0c5" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="4">STRUCTURE · CHROMATIN · TRANSCRIPTIONAL CHOICE</text>
  <g transform="translate(120 500)">
