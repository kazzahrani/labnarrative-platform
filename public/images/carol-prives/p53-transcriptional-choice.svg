    <g>
      <rect x="230" y="815" width="380" height="110" rx="22" fill="#183a2d" stroke="#7fc6a4" stroke-width="3"/>
      <text x="420" y="860" text-anchor="middle" fill="#d7f1e4" font-size="28" font-weight="700">CELL-CYCLE ARREST</text>
      <text x="420" y="895" text-anchor="middle" fill="#9fcab3" font-size="18">repair · checkpoint control</text>
    </g>
    <g>
