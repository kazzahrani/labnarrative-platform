    <path d="M486 145V205M850 145V205" stroke="#101d26" stroke-width="5"/>
    <path d="M980 85V205" stroke="#e35c3d" stroke-width="8"/>
    <path d="M935 110H1025" stroke="#e35c3d" stroke-width="8"/>
    <text x="1090" y="235" text-anchor="end" fill="#7d2e1f" font-size="22" font-weight="800">cell-cycle genes OFF</text>
