<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">p53–p21–DREAM/RB transcriptional repression</title>
  <desc id="desc">A regulatory cascade from DNA damage through p53 and p21 to DREAM and RB complexes repressing cell-cycle promoters.</desc>
  <defs>
