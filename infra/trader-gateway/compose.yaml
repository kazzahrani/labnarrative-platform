services:
  gateway:
    build: .
    restart: unless-stopped
    environment:
      PORT: 8080
      LN_GATEWAY_SHARED_SECRET: ${LN_GATEWAY_SHARED_SECRET}
    expose:
      - "8080"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - gateway
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
